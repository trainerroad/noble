name: prebuild

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prebuild:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win32
            os: windows-2022
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - run: npm install --ignore-scripts
      - name: Install prebuild CLI
        run: npm install --no-save --ignore-scripts prebuild@^13
      - name: Generate prebuilds
        run: npm run gen-prebuilds
      - name: Verify prebuilds were produced
        shell: bash
        run: |
          set -euo pipefail
          count=$(ls -1 prebuilds/@trainerroad/*.tar.gz 2>/dev/null | wc -l | tr -d ' ')
          echo "prebuild tarballs produced: ${count}"
          ls -l prebuilds/@trainerroad/ || true
          if [ "${count}" -eq 0 ]; then
            echo "::error::gen-prebuilds produced no tarballs. It logs per-target failures but always exits 0, so treat an empty prebuilds directory as a build failure."
            exit 1
          fi
          if ! ls -1 prebuilds/@trainerroad/ | grep -q -- '-electron-v136-win32-x64\.tar\.gz$'; then
            echo "::error::No electron-v136-win32-x64 tarball. That is the ABI the Electron 37 desktop app resolves, and without it every Windows install falls back to compiling from source."
            exit 1
          fi
          if ! ls -1 prebuilds/@trainerroad/ | grep -q -- '-node-v115-win32-x64\.tar\.gz$'; then
            echo "::error::No node-v115-win32-x64 tarball. TrainerRoadElectron installs noble on Node 20 (ABI 115) with node-pre-gyp's build-from-source fallback switched off on Windows, so without this file its Windows install fails on a 404."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.name }}
          path: prebuilds/@trainerroad/*.tar.gz
          if-no-files-found: error
          retention-days: 5

  release:
    needs: prebuild
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload prebuilds to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l artifacts
          if ! gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release create "${TAG}" --repo "${REPO}" \
              --title "${TAG}" \
              --notes "Prebuilt binaries for ${TAG}."
          fi
          gh release upload "${TAG}" artifacts/*.tar.gz --repo "${REPO}" --clobber
