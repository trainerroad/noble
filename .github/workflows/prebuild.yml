name: prebuild

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prebuild:
    name: Build win32 node prebuilds for v1.9.2-23
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - run: npm install --ignore-scripts
      - name: Install prebuild CLI
        run: npm install --no-save --ignore-scripts prebuild@^13
      - name: Generate prebuilds
        run: npm run gen-prebuilds
      - name: Verify every requested ABI was produced
        shell: bash
        run: |
          set -euo pipefail
          ls -l prebuilds/@trainerroad/
          missing=0
          for abi in 127 137 147; do
            name="noble-v1.9.2-23-node-v${abi}-win32-x64.tar.gz"
            if [ ! -f "prebuilds/@trainerroad/${name}" ]; then
              echo "::error::${name} was not produced"
              missing=1
            fi
          done
          exit "${missing}"
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-win32
          path: prebuilds/@trainerroad/*.tar.gz
          if-no-files-found: error
          retention-days: 5
