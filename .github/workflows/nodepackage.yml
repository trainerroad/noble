# Retired the Node 12-18 multi-OS build matrix and the codecov "Quality
# phase" job on 2026-09-08: neither had ever passed in this fork (node-gyp's
# 'rU' mode error on Python 3.11+, retired ubuntu-20.04/windows-2019
# runners). Native builds are covered by prebuild.yml instead.
name: Node.js package

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      # The install script runs node-pre-gyp --fallback-to-build, and this
      # repo's binding.gyp has no linux sources; native builds are covered
      # by prebuild.yml.
      - name: Install NPM packages
        run: npm install --ignore-scripts
      - name: Lint
        run: npm run lint
